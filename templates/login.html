{% extends 'base.html' %}

{% load static %}

{% block extra_css %}
<style>
.auth-page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, rgba(13, 148, 136, 0.9) 0%, rgba(20, 184, 166, 0.85) 100%),
                url('https://images.unsplash.com/photo-1469854523086-cc02fe5d8800?w=1920') center/cover fixed;
    padding: 50px 20px;
}
.auth-card {
    background: white;
    border-radius: 24px;
    padding: 50px;
    width: 100%;
    max-width: 450px;
    box-shadow: 0 30px 100px rgba(0,0,0,0.3);
}
.auth-header {
    text-align: center;
    margin-bottom: 35px;
}
.auth-logo {
    width: 100px;
    height: 100px;
    margin: 0 auto 20px;
}
.auth-header h2 {
    font-weight: 700;
    color: var(--text);
    margin-bottom: 8px;
}
.auth-header p {
    color: var(--text-light);
    margin: 0;
}
.form-group {
    margin-bottom: 20px;
}
.form-group label {
    display: block;
    margin-bottom: 8px;
    font-weight: 600;
    color: var(--text);
}
.form-control {
    width: 100%;
    padding: 14px 18px;
    border: 2px solid var(--border);
    border-radius: 10px;
    font-size: 1rem;
    background: white;
    color: var(--text);
    transition: all 0.3s;
}
.form-control:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 4px rgba(13, 148, 136, 0.1);
    outline: none;
}
.btn-auth {
    width: 100%;
    padding: 16px;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 1.1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
}
.btn-auth:hover {
    background: var(--primary-dark);
    transform: translateY(-2px);
    box-shadow: 0 10px 30px rgba(13, 148, 136, 0.3);
}
.auth-footer {
    text-align: center;
    margin-top: 25px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
}
.auth-footer p {
    color: var(--text-light);
    margin-bottom: 10px;
}
.auth-footer a {
    color: var(--primary);
    font-weight: 600;
    text-decoration: none;
}
.auth-footer a:hover {
    text-decoration: underline;
}
.theme-toggle-fixed {
    position: fixed;
    top: 20px;
    right: 20px;
    width: 45px;
    height: 45px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.4);
    background: rgba(255,255,255,0.2);
    backdrop-filter: blur(10px);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s;
    z-index: 1000;
    color: white;
    font-size: 18px;
}
.theme-toggle-fixed:hover {
    background: rgba(255,255,255,0.3);
    border-color: rgba(255,255,255,0.6);
}
</style>
{% endblock %}

{% block content %}
<button class="theme-toggle-fixed" onclick="toggleTheme()">
    <i class="fas fa-moon" id="themeIconAuth"></i>
</button>

<div class="auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <img src="{% static 'images/logo-unified-icon.svg' %}" alt="Tour & Travel" class="auth-logo">
            <h2>Welcome Back!</h2>
            <p>Login to continue your journey</p>
        </div>
        
        <form method="POST">
            {% csrf_token %}
            
            <div class="form-group">
                <label><i class="fas fa-user me-2" style="color: var(--primary);"></i>Username</label>
                <input type="text" class="form-control" name="username" required placeholder="Enter your username">
            </div>
            
            <div class="form-group">
                <label><i class="fas fa-lock me-2" style="color: var(--primary);"></i>Password</label>
                <input type="password" class="form-control" name="password" required placeholder="Enter your password">
            </div>
            
            <button type="submit" class="btn-auth">
                <i class="fas fa-sign-in-alt me-2"></i>Login
            </button>
        </form>
        
        <div class="auth-footer">
            <p>Don't have an account? <a href="{% url 'register' %}">Register here</a></p>
        </div>
    </div>
</div>

<script>
    function updateIconAuth(theme) {
        const icon = document.getElementById('themeIconAuth');
        if (icon) {
            icon.className = theme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
        }
    }
    (function() {
        const savedTheme = localStorage.getItem('theme') || 'light';
        updateIconAuth(savedTheme);
    })();
</script>
{% endblock %}
