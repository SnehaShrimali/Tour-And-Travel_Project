{% extends 'base.html' %}

{% block title %}Change Password - Tour & Travel{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <i class="fas fa-lock auth-icon"></i>
                <h2>Set New Password</h2>
                <p>Enter OTP and create new password</p>
            </div>
            
            <form method="POST" class="auth-form">
                {% csrf_token %}
                
                <div class="form-group">
                    <label><i class="fas fa-shield-alt"></i> OTP</label>
                    {{ form.otp }}
                </div>
                
                <div class="form-group">
                    <label><i class="fas fa-lock"></i> New Password</label>
                    <input type="password" name="new_password" class="form-control" required>
                </div>
                
                <div class="form-group">
                    <label><i class="fas fa-lock"></i> Confirm Password</label>
                    <input type="password" name="confirm_password" class="form-control" required>
                </div>
                
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary btn-block">
                        <i class="fas fa-save"></i> Change Password
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<style>
    .auth-wrapper {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        padding: 20px;
    }
    .auth-container { width: 100%; max-width: 450px; }
    .auth-card {
        background: white;
        border-radius: 20px;
        padding: 40px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .auth-header { text-align: center; margin-bottom: 30px; }
    .auth-icon { font-size: 50px; color: #667eea; margin-bottom: 15px; }
    .auth-header h2 { color: #333; font-weight: 600; margin-bottom: 5px; }
    .auth-header p { color: #666; font-size: 14px; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 8px; color: #333; font-weight: 500; }
    .form-group label i { margin-right: 8px; color: #667eea; }
    .form-control { padding: 12px 15px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 14px; width: 100%; }
    .form-control:focus { border-color: #667eea; outline: none; }
    .btn-block { width: 100%; padding: 14px; font-weight: 600; border-radius: 10px; font-size: 16px; }
</style>
{% endblock %}
