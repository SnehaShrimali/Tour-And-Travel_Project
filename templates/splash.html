{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tour & Travel - Welcome</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, rgba(13, 148, 136, 0.9) 0%, rgba(20, 184, 166, 0.85) 100%),
                        url('https://images.unsplash.com/photo-1469854523086-cc02fe5d8800?w=1920') center/cover fixed;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .splash-container {
            text-align: center;
            color: white;
            position: relative;
            z-index: 1;
        }
        .logo-wrapper {
            margin-bottom: 40px;
        }
        .logo-svg {
            width: 180px;
            height: 180px;
            margin: 0 auto;
            animation: pulse 2s ease-in-out infinite;
            filter: drop-shadow(0 10px 40px rgba(0,0,0,0.2));
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .brand-name {
            font-size: 3.5rem;
            font-weight: 800;
            margin-bottom: 10px;
            text-shadow: 0 5px 30px rgba(0,0,0,0.3);
            animation: fadeInUp 1s ease-out;
        }
        .tagline {
            font-size: 1.2rem;
            font-weight: 400;
            opacity: 0.95;
            letter-spacing: 3px;
            animation: fadeInUp 1s ease-out 0.2s backwards;
        }
        .loader-wrapper {
            margin-top: 60px;
            animation: fadeInUp 1s ease-out 0.4s backwards;
        }
        .loader {
            display: flex;
            justify-content: center;
            gap: 12px;
        }
        .loader-dot {
            width: 14px;
            height: 14px;
            background: white;
            border-radius: 50%;
            animation: bounce 1.4s ease-in-out infinite both;
        }
        .loader-dot:nth-child(1) { animation-delay: -0.32s; }
        .loader-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
        .loading-text {
            margin-top: 25px;
            font-size: 13px;
            letter-spacing: 4px;
            opacity: 0.9;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @media (max-width: 576px) {
            .brand-name { font-size: 2.5rem; }
            .tagline { font-size: 1rem; letter-spacing: 2px; }
            .logo-svg { width: 140px; height: 140px; }
        }
    </style>
</head>
<body>
    <div class="splash-container">
        <div class="logo-wrapper">
            <img src="{% static 'images/logo-master.svg' %}" alt="Tour & Travel" class="logo-svg">
        </div>
        <h1 class="brand-name">Tour & Travel</h1>
        <p class="tagline">EXCITED TO GO TOUR</p>
        
        <div class="loader-wrapper">
            <div class="loader">
                <div class="loader-dot"></div>
                <div class="loader-dot"></div>
                <div class="loader-dot"></div>
            </div>
            <p class="loading-text">LOADING...</p>
        </div>
    </div>

    <script>
        setTimeout(function() {
            window.location.href = "{% url 'login' %}";
        }, 3000);
    </script>
</body>
</html>
