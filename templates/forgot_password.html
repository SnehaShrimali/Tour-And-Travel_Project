{% extends 'base.html' %}

{% block title %}Forgot Password - Tour & Travel{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <i class="fas fa-key auth-icon"></i>
                <h2>Forgot Password</h2>
                <p>Enter your email to reset password</p>
            </div>
            
            <form method="POST" class="auth-form">
                {% csrf_token %}
                
                <div class="form-group">
                    <label><i class="fas fa-envelope"></i> Email Address</label>
                    {{ form.email }}
                    {% if form.email.errors %}
                    <div class="text-danger small">{{ form.email.errors.0 }}</div>
                    {% endif %}
                </div>
                
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary btn-block">
                        <i class="fas fa-paper-plane"></i> Send OTP
                    </button>
                </div>
            </form>
            
            <div class="auth-footer">
                <p><a href="{% url 'login' %}">Back to Login</a></p>
            </div>
        </div>
    </div>
</div>

<style>
    .auth-wrapper {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        padding: 20px;
    }
    .auth-container { width: 100%; max-width: 450px; }
    .auth-card {
        background: white;
        border-radius: 20px;
        padding: 40px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .auth-header { text-align: center; margin-bottom: 30px; }
    .auth-icon { font-size: 50px; color: #667eea; margin-bottom: 15px; }
    .auth-header h2 { color: #333; font-weight: 600; margin-bottom: 5px; }
    .auth-header p { color: #666; font-size: 14px; }
    .form-group { margin-bottom: 20px; }
    .form-group label {
        display: block;
        margin-bottom: 8px;
        color: #333;
        font-weight: 500;
    }
    .form-group label i { margin-right: 8px; color: #667eea; }
    .form-control {
        padding: 12px 15px;
        border: 2px solid #e0e0e0;
        border-radius: 10px;
        font-size: 14px;
        width: 100%;
    }
    .form-control:focus { border-color: #667eea; outline: none; }
    .btn-block { width: 100%; padding: 14px; font-weight: 600; border-radius: 10px; font-size: 16px; }
    .auth-footer { text-align: center; margin-top: 25px; padding-top: 20px; border-top: 1px solid #eee; }
    .auth-footer a { color: #667eea; font-weight: 600; }
</style>
{% endblock %}
