{% extends 'base.html' %}

{% block extra_css %}
<style>
.otp-page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
    padding: 50px 20px;
}
.otp-card {
    background: white;
    border-radius: 24px;
    padding: 45px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 25px 80px rgba(0,0,0,0.3);
}
.otp-header {
    text-align: center;
    margin-bottom: 30px;
}
.otp-icon {
    width: 90px;
    height: 90px;
    background: rgba(13,148,136,0.1);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
}
.otp-icon i {
    font-size: 40px;
    color: var(--primary);
}
.otp-header h2 {
    font-weight: 700;
    color: var(--text);
    margin-bottom: 10px;
}
.otp-header p {
    color: var(--text-light);
    margin: 0;
    font-size: 14px;
}
.otp-input-container {
    display: flex;
    justify-content: center;
    margin-bottom: 10px;
}
.otp-input {
    text-align: center;
    font-size: 32px;
    font-weight: 700;
    letter-spacing: 12px;
    padding: 14px 18px;
    border: 3px solid var(--border);
    border-radius: 12px;
    width: 200px;
    background: white;
    color: var(--text);
    transition: all 0.3s;
}
.otp-input::placeholder {
    color: var(--text-light);
}
.otp-input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 4px rgba(13,148,136,0.1);
    outline: none;
}
.text-danger {
    color: #ef4444;
    font-size: 13px;
    text-align: center;
}
.btn-verify {
    width: 100%;
    padding: 14px;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
    margin-top: 20px;
}
.btn-verify:hover {
    background: var(--primary-dark);
    transform: translateY(-2px);
    box-shadow: 0 10px 30px rgba(13,148,136,0.3);
}
.otp-footer {
    text-align: center;
    margin-top: 22px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
}
.otp-footer p {
    color: var(--text-light);
    margin-bottom: 10px;
    font-size: 14px;
}
.otp-footer a {
    color: var(--primary);
    font-weight: 600;
    text-decoration: none;
}
.otp-footer a:hover {
    text-decoration: underline;
}
.theme-toggle-fixed {
    position: fixed;
    top: 20px;
    right: 20px;
    background: rgba(255,255,255,0.2);
    border: 2px solid rgba(255,255,255,0.3);
    border-radius: 50px;
    padding: 12px 18px;
    cursor: pointer;
    transition: all 0.3s;
    z-index: 1000;
    color: white;
}
.theme-toggle-fixed:hover {
    background: rgba(255,255,255,0.3);
    border-color: rgba(255,255,255,0.5);
}
.theme-toggle-fixed i {
    font-size: 18px;
}
</style>
{% endblock %}

{% block content %}
<button class="theme-toggle-fixed" onclick="toggleTheme()" title="Toggle Dark Mode">
    <i class="fas fa-moon" id="themeIconAuth"></i>
</button>

<div class="otp-page">
    <div class="otp-card">
        <div class="otp-header">
            <div class="otp-icon">
                <i class="fas fa-shield-alt"></i>
            </div>
            <h2>Verify Your Account</h2>
            <p>Enter the 6-digit code sent to<br><strong>{{ email }}</strong></p>
        </div>
        
        <form method="POST">
            {% csrf_token %}
            
            <div class="otp-input-container">
                <input type="text" class="otp-input" name="otp" maxlength="6" pattern="[0-9]{6}" placeholder="123456" required>
            </div>
            {% if form.otp.errors %}
            <div class="text-danger">{{ form.otp.errors.0 }}</div>
            {% endif %}
            
            <button type="submit" class="btn-verify">
                <i class="fas fa-check-circle me-2"></i>Verify OTP
            </button>
        </form>
        
        <div class="otp-footer">
            <p>Didn't receive the code? <a href="#" id="resendBtn">Resend OTP</a></p>
            <p><a href="{% url 'login' %}"><i class="fas fa-arrow-left me-1"></i>Back to Login</a></p>
        </div>
    </div>
</div>

<script>
document.getElementById('resendBtn').addEventListener('click', function(e) {
    e.preventDefault();
    fetch('{% url "resend_otp" %}')
        .then(response => response.json())
        .then(data => {
            alert(data.message);
        });
});

function updateIconAuth(theme) {
    const icon = document.getElementById('themeIconAuth');
    if (icon) {
        icon.className = theme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
    }
}

(function() {
    const savedTheme = localStorage.getItem('theme') || 'light';
    updateIconAuth(savedTheme);
})();
</script>
{% endblock %}
