<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 120">
  <defs>
    <linearGradient id="pbH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a"/>
      <stop offset="50%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <linearGradient id="skyH" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#dbeafe"/>
      <stop offset="100%" style="stop-color:#eff6ff"/>
    </linearGradient>
    <linearGradient id="m1H" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af"/>
      <stop offset="100%" style="stop-color:#1e3a8a"/>
    </linearGradient>
    <linearGradient id="m2H" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#1e40af"/>
    </linearGradient>
    <linearGradient id="m3H" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <linearGradient id="aoH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ea580c"/>
      <stop offset="50%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#fb923c"/>
    </linearGradient>
    <linearGradient id="sgH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
    <filter id="shH" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1e40af" flood-opacity="0.15"/>
    </filter>
    <filter id="glH" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <!-- Icon Section -->
  <g transform="translate(5, 5)">
    <!-- Badge -->
    <circle cx="55" cy="55" r="52" fill="white" stroke="url(#pbH)" stroke-width="2.5" filter="url(#shH)"/>
    <circle cx="55" cy="55" r="46" fill="none" stroke="#dbeafe" stroke-width="1"/>
    
    <!-- Sky Arc -->
    <path d="M18,55 A37,37 0 0,1 92,55" fill="url(#skyH)" opacity="0.4"/>
    
    <!-- Sun -->
    <g filter="url(#glH)">
      <circle cx="55" cy="30" r="10" fill="url(#aoH)" opacity="0.9"/>
      <circle cx="55" cy="30" r="7" fill="url(#sgH)"/>
    </g>
    
    <!-- Sun Rays -->
    <g stroke="#fbbf24" stroke-width="1.2" stroke-linecap="round" opacity="0.7">
      <line x1="55" y1="17" x2="55" y2="13"/>
      <line x1="65" y1="22" x2="68" y2="19"/>
      <line x1="72" y1="30" x2="76" y2="30"/>
      <line x1="45" y1="22" x2="42" y2="19"/>
      <line x1="38" y1="30" x2="34" y2="30"/>
    </g>
    
    <!-- Mountain Back -->
    <polygon points="22,75 40,48 58,75" fill="#1e3a8a" opacity="0.4"/>
    
    <!-- Mountain Middle -->
    <polygon points="35,78 55,45 75,78" fill="url(#m2H)" opacity="0.7"/>
    
    <!-- Mountain Front Left -->
    <polygon points="18,82 42,52 66,82" fill="url(#m1H)"/>
    
    <!-- Mountain Front Right -->
    <polygon points="52,82 68,58 84,82" fill="url(#m3H)"/>
    
    <!-- Snow Caps -->
    <polygon points="42,52 46,58 42,56 38,58" fill="white" opacity="0.9"/>
    <polygon points="55,45 59,52 55,49 51,52" fill="white" opacity="0.9"/>
    <polygon points="68,58 72,62 68,60 64,62" fill="white" opacity="0.9"/>
    
    <!-- Flight Path -->
    <path d="M82,62 Q88,52 92,42 Q96,32 102,22" stroke="url(#aoH)" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-dasharray="5 3"/>
    
    <!-- Airplane -->
    <g transform="translate(98, 16) rotate(-35)">
      <path d="M0,-3 L18,0 L0,3 L3,0 Z" fill="url(#pbH)"/>
      <path d="M8,0 L13,-7 L16,-6 L13,0 L16,6 L13,7 Z" fill="#60a5fa"/>
      <path d="M16,0 L20,-4 L22,-3 L18,0 L22,3 L20,4 Z" fill="#93c5fd"/>
      <circle cx="5" cy="0" r="1.2" fill="#dbeafe"/>
    </g>
    
    <!-- Car -->
    <g transform="translate(28, 78)">
      <path d="M0,5 L2,2 L6,1 L14,1 L18,2 L22,2 L22,5 Z" fill="#1e40af" opacity="0.85"/>
      <ellipse cx="5" cy="6.5" rx="2" ry="2" fill="#0f172a"/>
      <ellipse cx="5" cy="6.5" rx="1.2" ry="1.2" fill="#64748b"/>
      <ellipse cx="17" cy="6.5" rx="2" ry="2" fill="#0f172a"/>
      <ellipse cx="17" cy="6.5" rx="1.2" ry="1.2" fill="#64748b"/>
      <rect x="7" y="1.5" width="4.5" height="3" rx="0.3" fill="#dbeafe" opacity="0.85"/>
      <rect x="12" y="1.5" width="4" height="3" rx="0.3" fill="#dbeafe" opacity="0.85"/>
    </g>
    
    <!-- Bus -->
    <g transform="translate(60, 76)">
      <rect x="0" y="2" width="26" height="9" rx="1.5" fill="#3b82f6" opacity="0.9"/>
      <rect x="2" y="0" width="4.5" height="3.2" rx="0.8" fill="#1e40af"/>
      <ellipse cx="5" cy="11" rx="2.5" ry="2.5" fill="#0f172a"/>
      <ellipse cx="5" cy="11" rx="1.5" ry="1.5" fill="#64748b"/>
      <ellipse cx="21" cy="11" rx="2.5" ry="2.5" fill="#0f172a"/>
      <ellipse cx="21" cy="11" rx="1.5" ry="1.5" fill="#64748b"/>
      <rect x="8" y="3.2" width="3.2" height="4.5" rx="0.3" fill="#dbeafe" opacity="0.85"/>
      <rect x="12.5" y="3.2" width="3.2" height="4.5" rx="0.3" fill="#dbeafe" opacity="0.85"/>
      <rect x="17" y="3.2" width="3.2" height="4.5" rx="0.3" fill="#dbeafe" opacity="0.85"/>
    </g>
    
    <!-- Road -->
    <path d="M50,84 Q55,86 60,84" stroke="#1e40af" stroke-width="1.2" fill="none" stroke-dasharray="3 2" opacity="0.5"/>
    
    <!-- Sparkles -->
    <g fill="#fbbf24">
      <circle cx="25" cy="22" r="1.2"/>
      <circle cx="85" cy="32" r="1"/>
    </g>
  </g>
  
  <!-- Text Section -->
  <g transform="translate(130, 0)">
    <!-- Brand Name -->
    <text x="0" y="52" font-family="'Poppins', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="700" fill="#1e3a8a" letter-spacing="0.5">Tour &amp; Travel</text>
    
    <!-- Tagline -->
    <text x="2" y="76" font-family="'Poppins', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" fill="#f97316" letter-spacing="3">EXCITED TO GO TOUR</text>
    
    <!-- Decorative Line -->
    <line x1="0" y1="90" x2="320" y2="90" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Accent Dot -->
    <circle cx="330" cy="89" r="4" fill="url(#aoH)"/>
  </g>
</svg>
