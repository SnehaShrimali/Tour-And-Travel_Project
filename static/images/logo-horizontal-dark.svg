<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120">
  <defs>
    <linearGradient id="skyGradientHD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7dd3fc;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="mountainGradient1HD" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#14b8a6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d9488;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="mountainGradient2HD" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#5eead4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#14b8a6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradientHD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fb923c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fdba74;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="circleGradientHD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#134e4a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f766e;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Icon Section (Left) - Dark Mode -->
  <g transform="translate(10, 5)">
    <!-- Background Circle -->
    <circle cx="55" cy="55" r="50" fill="url(#circleGradientHD)" stroke="#14b8a6" stroke-width="2"/>
    
    <!-- Inner Circle Border -->
    <circle cx="55" cy="55" r="44" fill="none" stroke="#5eead4" stroke-width="1" stroke-dasharray="4 2" opacity="0.4"/>
    
    <!-- Sun -->
    <circle cx="55" cy="30" r="12" fill="url(#accentGradientHD)" opacity="0.95"/>
    <circle cx="55" cy="30" r="9" fill="#fbbf24"/>
    
    <!-- Sun Rays -->
    <g stroke="#fbbf24" stroke-width="1" opacity="0.7">
      <line x1="55" y1="15" x2="55" y2="11"/>
      <line x1="68" y1="18" x2="71" y2="15"/>
      <line x1="75" y1="30" x2="79" y2="30"/>
      <line x1="42" y1="18" x2="39" y2="15"/>
      <line x1="35" y1="30" x2="31" y2="30"/>
    </g>
    
    <!-- Back Mountains -->
    <polygon points="25,65 40,40 55,65" fill="#0d9488" opacity="0.8"/>
    <polygon points="45,65 60,38 75,65" fill="#14b8a6" opacity="0.9"/>
    
    <!-- Front Mountains -->
    <polygon points="18,72 38,48 58,72" fill="url(#mountainGradient1HD)"/>
    <polygon points="42,72 62,45 82,72" fill="url(#mountainGradient2HD)"/>
    <polygon points="65,72 78,55 90,72" fill="url(#mountainGradient1HD)"/>
    
    <!-- Mountain Snow Caps -->
    <polygon points="38,48 41,52 38,50 35,52" fill="white" opacity="0.6"/>
    <polygon points="62,45 66,52 62,48 58,52" fill="white" opacity="0.6"/>
    
    <!-- Airplane Trail -->
    <path d="M75,28 Q85,22 95,15 Q102,10 110,5" stroke="url(#accentGradientHD)" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-dasharray="4 3"/>
    
    <!-- Airplane -->
    <g transform="translate(106, 1) rotate(-30)">
      <path d="M0,-3 L15,0 L0,3 L3,0 Z" fill="#93c5fd"/>
      <path d="M15,0 L21,-5 L24,-4 L21,0 L24,4 L21,5 Z" fill="#bfdbfe"/>
      <circle cx="3" cy="0" r="1.5" fill="#fbbf24"/>
    </g>
    
    <!-- Stars -->
    <g fill="#fcd34d" opacity="0.9">
      <circle cx="20" cy="28" r="1.5"/>
      <circle cx="88" cy="42" r="1"/>
    </g>
  </g>
  
  <!-- Text Section (Right) - Dark Mode -->
  <g transform="translate(135, 0)">
    <!-- Brand Name -->
    <text x="0" y="52" font-family="'Poppins', 'Segoe UI', Arial, sans-serif" font-size="32" font-weight="700" fill="#5eead4">Tour &amp; Travel</text>
    
    <!-- Tagline -->
    <text x="2" y="75" font-family="'Poppins', 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#99f6e4" letter-spacing="2.5">EXCITED TO GO TOUR</text>
    
    <!-- Decorative Line -->
    <line x1="0" y1="85" x2="280" y2="85" stroke="#14b8a6" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Accent Dot -->
    <circle cx="288" cy="84" r="4" fill="url(#accentGradientHD)"/>
  </g>
</svg>
