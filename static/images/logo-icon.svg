<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="mountainGradient1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0d9488;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f766e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="mountainGradient2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#14b8a6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d9488;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fb923c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="circleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0fdfa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ccfbf1;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0d9488" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="90" fill="url(#circleGradient)" stroke="#0d9488" stroke-width="2" filter="url(#shadow)"/>
  
  <!-- Inner Circle Border -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="#14b8a6" stroke-width="1" stroke-dasharray="5 3" opacity="0.5"/>
  
  <!-- Sun -->
  <circle cx="100" cy="55" r="18" fill="url(#accentGradient)" opacity="0.9"/>
  <circle cx="100" cy="55" r="14" fill="#fbbf24"/>
  
  <!-- Sun Rays -->
  <g stroke="#fbbf24" stroke-width="1.5" opacity="0.6">
    <line x1="100" y1="32" x2="100" y2="26"/>
    <line x1="118" y1="37" x2="123" y2="32"/>
    <line x1="128" y1="55" x2="134" y2="55"/>
    <line x1="82" y1="37" x2="77" y2="32"/>
    <line x1="72" y1="55" x2="66" y2="55"/>
  </g>
  
  <!-- Back Mountains -->
  <polygon points="55,120 75,80 95,120" fill="#0f766e" opacity="0.7"/>
  <polygon points="85,120 115,70 145,120" fill="#0d9488" opacity="0.8"/>
  
  <!-- Front Mountains -->
  <polygon points="40,130 70,90 100,130" fill="url(#mountainGradient1)"/>
  <polygon points="80,130 115,85 150,130" fill="url(#mountainGradient2)"/>
  <polygon points="130,130 155,100 180,130" fill="url(#mountainGradient1)"/>
  
  <!-- Mountain Snow Caps -->
  <polygon points="70,90 75,98 70,95 65,98" fill="white" opacity="0.8"/>
  <polygon points="115,85 122,98 115,92 108,98" fill="white" opacity="0.8"/>
  <polygon points="155,100 160,108 155,104 150,108" fill="white" opacity="0.8"/>
  
  <!-- Airplane Trail -->
  <path d="M140,55 Q155,45 168,35 Q178,28 188,20" stroke="url(#accentGradient)" stroke-width="2" fill="none" stroke-linecap="round" stroke-dasharray="6 4"/>
  
  <!-- Airplane -->
  <g transform="translate(182, 12) rotate(-25)">
    <path d="M0,-4 L20,0 L0,4 L4,0 Z" fill="#1e40af"/>
    <path d="M20,0 L28,-6 L32,-5 L28,0 L32,5 L28,6 Z" fill="#3b82f6"/>
    <circle cx="4" cy="0" r="2.5" fill="#fbbf24"/>
  </g>
  
  <!-- Stars/Sparkles -->
  <g fill="#fbbf24" opacity="0.8">
    <circle cx="45" cy="50" r="2"/>
    <circle cx="155" cy="75" r="1.5"/>
    <circle cx="60" cy="100" r="1"/>
  </g>
</svg>
