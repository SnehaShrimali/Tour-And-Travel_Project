<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <!-- Primary Blue Gradient -->
    <linearGradient id="primaryBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a"/>
      <stop offset="50%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    
    <!-- Sky Gradient -->
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#dbeafe"/>
      <stop offset="100%" style="stop-color:#eff6ff"/>
    </linearGradient>
    
    <!-- Mountain Gradients -->
    <linearGradient id="mountain1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af"/>
      <stop offset="100%" style="stop-color:#1e3a8a"/>
    </linearGradient>
    
    <linearGradient id="mountain2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#1e40af"/>
    </linearGradient>
    
    <linearGradient id="mountain3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    
    <!-- Accent Orange Gradient -->
    <linearGradient id="accentOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ea580c"/>
      <stop offset="50%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#fb923c"/>
    </linearGradient>
    
    <!-- Sun Gradient -->
    <linearGradient id="sunGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
    
    <!-- Circle Badge Gradient -->
    <linearGradient id="badgeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#f0f9ff"/>
    </linearGradient>
    
    <!-- Shadow Filter -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1e40af" flood-opacity="0.15"/>
    </filter>
    
    <!-- Glow Filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Main Badge Circle -->
  <circle cx="200" cy="195" r="155" fill="url(#badgeGradient)" stroke="url(#primaryBlue)" stroke-width="4" filter="url(#softShadow)"/>
  
  <!-- Inner Circle Ring -->
  <circle cx="200" cy="195" r="142" fill="none" stroke="#dbeafe" stroke-width="2"/>
  
  <!-- Sky Background Arc -->
  <path d="M70,195 A130,130 0 0,1 330,195" fill="url(#skyGradient)" opacity="0.5"/>
  
  <!-- Sun with Rays -->
  <g filter="url(#glow)">
    <circle cx="200" cy="95" r="28" fill="url(#accentOrange)" opacity="0.9"/>
    <circle cx="200" cy="95" r="22" fill="url(#sunGradient)"/>
  </g>
  
  <!-- Sun Rays -->
  <g stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" opacity="0.8">
    <line x1="200" y1="58" x2="200" y2="48"/>
    <line x1="225" y1="70" x2="232" y2="62"/>
    <line x1="240" y1="95" x2="252" y2="95"/>
    <line x1="175" y1="70" x2="168" y2="62"/>
    <line x1="160" y1="95" x2="148" y2="95"/>
  </g>
  
  <!-- Mountain Layer 3 (Back) -->
  <polygon points="70,280 130,160 190,280" fill="#1e3a8a" opacity="0.4"/>
  
  <!-- Mountain Layer 2 (Middle) -->
  <polygon points="110,290 180,150 250,290" fill="url(#mountain2)" opacity="0.7"/>
  
  <!-- Mountain Layer 1 (Front Left) -->
  <polygon points="55,300 135,180 215,300" fill="url(#mountain1)"/>
  
  <!-- Mountain Layer 1 (Front Right) -->
  <polygon points="185,300 255,190 325,300" fill="url(#mountain3)"/>
  
  <!-- Snow Caps on Mountains -->
  <polygon points="135,180 148,200 135,195 122,200" fill="white" opacity="0.9"/>
  <polygon points="180,150 195,175 180,165 165,175" fill="white" opacity="0.9"/>
  <polygon points="255,190 265,205 255,200 245,205" fill="white" opacity="0.9"/>
  
  <!-- Flight Path Curve (connecting road to sky) -->
  <path d="M320,240 Q340,200 350,160 Q360,120 380,80" stroke="url(#accentOrange)" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="15 8"/>
  
  <!-- Airplane -->
  <g transform="translate(368, 58) rotate(-35)">
    <!-- Fuselage -->
    <path d="M0,-6 L45,0 L0,6 L8,0 Z" fill="url(#primaryBlue)"/>
    <!-- Wings -->
    <path d="M20,0 L32,-18 L40,-15 L35,0 L40,15 L32,18 Z" fill="#60a5fa"/>
    <!-- Tail -->
    <path d="M40,0 L52,-10 L56,-8 L48,0 L56,8 L52,10 Z" fill="#93c5fd"/>
    <!-- Windows -->
    <circle cx="15" cy="0" r="3" fill="#dbeafe"/>
    <circle cx="26" cy="0" r="2.5" fill="#dbeafe"/>
  </g>
  
  <!-- Car Silhouette (integrated at mountain base) -->
  <g transform="translate(95, 295)">
    <path d="M0,15 L5,5 L15,2 L35,2 L45,5 L55,5 L55,15 Z" fill="#1e40af" opacity="0.8"/>
    <ellipse cx="12" cy="17" rx="5" ry="5" fill="#0f172a"/>
    <ellipse cx="12" cy="17" rx="3" ry="3" fill="#64748b"/>
    <ellipse cx="43" cy="17" rx="5" ry="5" fill="#0f172a"/>
    <ellipse cx="43" cy="17" rx="3" ry="3" fill="#64748b"/>
    <rect x="18" y="4" width="12" height="8" rx="1" fill="#dbeafe" opacity="0.8"/>
    <rect x="32" y="4" width="10" height="8" rx="1" fill="#dbeafe" opacity="0.8"/>
  </g>
  
  <!-- Bus Silhouette (integrated at mountain base) -->
  <g transform="translate(250, 288)">
    <rect x="0" y="5" width="65" height="22" rx="4" fill="#3b82f6" opacity="0.9"/>
    <rect x="5" y="0" width="12" height="8" rx="2" fill="#1e40af"/>
    <ellipse cx="12" cy="27" rx="6" ry="6" fill="#0f172a"/>
    <ellipse cx="12" cy="27" rx="4" ry="4" fill="#64748b"/>
    <ellipse cx="52" cy="27" rx="6" ry="6" fill="#0f172a"/>
    <ellipse cx="52" cy="27" rx="4" ry="4" fill="#64748b"/>
    <!-- Windows -->
    <rect x="20" y="8" width="8" height="10" rx="1" fill="#dbeafe" opacity="0.8"/>
    <rect x="30" y="8" width="8" height="10" rx="1" fill="#dbeafe" opacity="0.8"/>
    <rect x="40" y="8" width="8" height="10" rx="1" fill="#dbeafe" opacity="0.8"/>
    <rect x="50" y="8" width="8" height="10" rx="1" fill="#dbeafe" opacity="0.8"/>
  </g>
  
  <!-- Road Path (connecting car to bus) -->
  <path d="M150,305 Q200,310 250,305" stroke="#1e40af" stroke-width="3" fill="none" stroke-dasharray="8 4" opacity="0.6"/>
  
  <!-- Stars / Sparkles -->
  <g fill="#fbbf24">
    <polygon points="85,70 88,78 96,78 90,83 92,91 85,86 78,91 80,83 74,78 82,78" transform="scale(0.4) translate(80, 60)"/>
    <polygon points="85,70 88,78 96,78 90,83 92,91 85,86 78,91 80,83 74,78 82,78" transform="scale(0.3) translate(850, 150)"/>
    <polygon points="85,70 88,78 96,78 90,83 92,91 85,86 78,91 80,83 74,78 82,78" transform="scale(0.35) translate(500, 500)"/>
  </g>
  
  <!-- Brand Name -->
  <text x="200" y="348" text-anchor="middle" font-family="'Poppins', 'Segoe UI', Arial, sans-serif" font-size="32" font-weight="700" fill="#1e3a8a" letter-spacing="1">Tour &amp; Travel</text>
  
  <!-- Tagline -->
  <text x="200" y="375" text-anchor="middle" font-family="'Poppins', 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500" fill="#f97316" letter-spacing="3">EXCITED TO GO TOUR</text>
  
  <!-- Decorative Lines -->
  <line x1="100" y1="385" x2="160" y2="385" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <circle cx="200" cy="385" r="3" fill="#f97316"/>
  <line x1="240" y1="385" x2="300" y2="385" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
</svg>
