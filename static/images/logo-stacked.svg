<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="mountainGradient1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0d9488;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f766e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="mountainGradient2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#14b8a6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d9488;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fb923c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="circleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0fdfa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ccfbf1;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0d9488" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="200" cy="180" r="140" fill="url(#circleGradient)" stroke="#0d9488" stroke-width="3" filter="url(#shadow)"/>
  
  <!-- Inner Circle Border -->
  <circle cx="200" cy="180" r="125" fill="none" stroke="#14b8a6" stroke-width="1" stroke-dasharray="8 4" opacity="0.5"/>
  
  <!-- Sun -->
  <circle cx="200" cy="100" r="28" fill="url(#accentGradient)" opacity="0.9"/>
  <circle cx="200" cy="100" r="22" fill="#fbbf24"/>
  
  <!-- Sun Rays -->
  <g stroke="#fbbf24" stroke-width="2" opacity="0.6">
    <line x1="200" y1="65" x2="200" y2="55"/>
    <line x1="225" y1="75" x2="232" y2="68"/>
    <line x1="240" y1="100" x2="250" y2="100"/>
    <line x1="175" y1="75" x2="168" y2="68"/>
    <line x1="160" y1="100" x2="150" y2="100"/>
  </g>
  
  <!-- Back Mountains -->
  <polygon points="120,220 160,150 200,220" fill="#0f766e" opacity="0.7"/>
  <polygon points="180,220 230,140 280,220" fill="#0d9488" opacity="0.8"/>
  
  <!-- Front Mountains -->
  <polygon points="100,240 150,170 200,240" fill="url(#mountainGradient1)"/>
  <polygon points="170,240 220,160 270,240" fill="url(#mountainGradient2)"/>
  <polygon points="230,240 280,185 330,240" fill="url(#mountainGradient1)"/>
  
  <!-- Mountain Snow Caps -->
  <polygon points="150,170 160,185 150,180 140,185" fill="white" opacity="0.8"/>
  <polygon points="220,160 230,180 220,172 210,180" fill="white" opacity="0.8"/>
  <polygon points="280,185 288,198 280,192 272,198" fill="white" opacity="0.8"/>
  
  <!-- Airplane Trail -->
  <path d="M280 120 Q300 100 320 85 Q340 70 360 55" stroke="url(#accentGradient)" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="10 6"/>
  
  <!-- Airplane -->
  <g transform="translate(355, 45) rotate(-30)">
    <path d="M0,-5 L25,0 L0,5 L5,0 Z" fill="#1e40af"/>
    <path d="M25,0 L35,-8 L40,-6 L35,0 L40,6 L35,8 Z" fill="#3b82f6"/>
    <circle cx="5" cy="0" r="3" fill="#fbbf24"/>
  </g>
  
  <!-- Stars/Sparkles -->
  <g fill="#fbbf24">
    <polygon points="130,90 133,96 140,96 135,100 137,107 130,103 123,107 125,100 120,96 127,96" transform="scale(0.5) translate(100, 50)"/>
    <polygon points="130,90 133,96 140,96 135,100 137,107 130,103 123,107 125,100 120,96 127,96" transform="scale(0.4) translate(550, 200)"/>
    <polygon points="130,90 133,96 140,96 135,100 137,107 130,103 123,107 125,100 120,96 127,96" transform="scale(0.3) translate(250, 450)"/>
  </g>
  
  <!-- Brand Name -->
  <text x="200" y="295" text-anchor="middle" font-family="'Poppins', Arial, sans-serif" font-size="28" font-weight="700" fill="#0f766e">Tour &amp; Travel</text>
  
  <!-- Tagline -->
  <text x="200" y="320" text-anchor="middle" font-family="'Poppins', Arial, sans-serif" font-size="12" font-weight="400" fill="#0d9488" letter-spacing="2">EXCITED TO GO TOUR</text>
  
  <!-- Decorative Line -->
  <line x1="140" y1="335" x2="260" y2="335" stroke="#14b8a6" stroke-width="2" stroke-linecap="round"/>
</svg>
