<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="pb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a"/>
      <stop offset="50%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#dbeafe"/>
      <stop offset="100%" style="stop-color:#eff6ff"/>
    </linearGradient>
    <linearGradient id="m1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af"/>
      <stop offset="100%" style="stop-color:#1e3a8a"/>
    </linearGradient>
    <linearGradient id="m2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#1e40af"/>
    </linearGradient>
    <linearGradient id="m3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <linearGradient id="ao" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ea580c"/>
      <stop offset="50%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#fb923c"/>
    </linearGradient>
    <linearGradient id="sg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1e40af" flood-opacity="0.15"/>
    </filter>
    <filter id="gl" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <!-- Badge -->
  <circle cx="100" cy="100" r="90" fill="white" stroke="url(#pb)" stroke-width="3" filter="url(#sh)"/>
  <circle cx="100" cy="100" r="83" fill="none" stroke="#dbeafe" stroke-width="1"/>
  
  <!-- Sky Arc -->
  <path d="M30,100 A70,70 0 0,1 170,100" fill="url(#sky)" opacity="0.4"/>
  
  <!-- Sun -->
  <g filter="url(#gl)">
    <circle cx="100" cy="48" r="16" fill="url(#ao)" opacity="0.9"/>
    <circle cx="100" cy="48" r="12" fill="url(#sg)"/>
  </g>
  
  <!-- Sun Rays -->
  <g stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" opacity="0.8">
    <line x1="100" y1="28" x2="100" y2="22"/>
    <line x1="115" y1="35" x2="120" y2="30"/>
    <line x1="125" y1="48" x2="132" y2="48"/>
    <line x1="85" y1="35" x2="80" y2="30"/>
    <line x1="75" y1="48" x2="68" y2="48"/>
  </g>
  
  <!-- Mountain Back -->
  <polygon points="30,145 65,85 100,145" fill="#1e3a8a" opacity="0.4"/>
  
  <!-- Mountain Middle -->
  <polygon points="50,150 90,78 130,150" fill="url(#m2)" opacity="0.7"/>
  
  <!-- Mountain Front Left -->
  <polygon points="25,158 68,95 110,158" fill="url(#m1)"/>
  
  <!-- Mountain Front Right -->
  <polygon points="90,158 128,100 165,158" fill="url(#m3)"/>
  
  <!-- Snow Caps -->
  <polygon points="68,95 74,105 68,102 62,105" fill="white" opacity="0.9"/>
  <polygon points="90,78 98,92 90,86 82,92" fill="white" opacity="0.9"/>
  <polygon points="128,100 134,108 128,105 122,108" fill="white" opacity="0.9"/>
  
  <!-- Flight Path -->
  <path d="M165,125 Q175,105 180,85 Q185,65 195,45" stroke="url(#ao)" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-dasharray="8 5"/>
  
  <!-- Airplane -->
  <g transform="translate(188, 32) rotate(-35)">
    <path d="M0,-4 L30,0 L0,4 L5,0 Z" fill="url(#pb)"/>
    <path d="M13,0 L21,-12 L26,-10 L22,0 L26,10 L21,12 Z" fill="#60a5fa"/>
    <path d="M26,0 L34,-7 L37,-5 L31,0 L37,5 L34,7 Z" fill="#93c5fd"/>
    <circle cx="10" cy="0" r="2" fill="#dbeafe"/>
  </g>
  
  <!-- Car -->
  <g transform="translate(48, 150)">
    <path d="M0,8 L3,3 L9,1 L22,1 L28,3 L33,3 L33,8 Z" fill="#1e40af" opacity="0.85"/>
    <ellipse cx="8" cy="10" rx="3" ry="3" fill="#0f172a"/>
    <ellipse cx="8" cy="10" rx="2" ry="2" fill="#64748b"/>
    <ellipse cx="25" cy="10" rx="3" ry="3" fill="#0f172a"/>
    <ellipse cx="25" cy="10" rx="2" ry="2" fill="#64748b"/>
    <rect x="11" y="2" width="7" height="5" rx="0.5" fill="#dbeafe" opacity="0.85"/>
    <rect x="19" y="2" width="6" height="5" rx="0.5" fill="#dbeafe" opacity="0.85"/>
  </g>
  
  <!-- Bus -->
  <g transform="translate(115, 146)">
    <rect x="0" y="3" width="40" height="14" rx="2.5" fill="#3b82f6" opacity="0.9"/>
    <rect x="3" y="0" width="7" height="5" rx="1" fill="#1e40af"/>
    <ellipse cx="8" cy="17" rx="4" ry="4" fill="#0f172a"/>
    <ellipse cx="8" cy="17" rx="2.5" ry="2.5" fill="#64748b"/>
    <ellipse cx="32" cy="17" rx="4" ry="4" fill="#0f172a"/>
    <ellipse cx="32" cy="17" rx="2.5" ry="2.5" fill="#64748b"/>
    <rect x="12" y="5" width="5" height="7" rx="0.5" fill="#dbeafe" opacity="0.85"/>
    <rect x="19" y="5" width="5" height="7" rx="0.5" fill="#dbeafe" opacity="0.85"/>
    <rect x="26" y="5" width="5" height="7" rx="0.5" fill="#dbeafe" opacity="0.85"/>
  </g>
  
  <!-- Road -->
  <path d="M88,158 Q100,162 112,158" stroke="#1e40af" stroke-width="2" fill="none" stroke-dasharray="5 3" opacity="0.5"/>
  
  <!-- Sparkles -->
  <g fill="#fbbf24">
    <circle cx="45" cy="35" r="2"/>
    <circle cx="155" cy="55" r="1.5"/>
    <circle cx="38" cy="75" r="1"/>
  </g>
</svg>
